name: Inspect Framer reference
on:
  push:
    paths:
      - '.github/workflows/inspect-framer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect page routes and dependencies
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen, Request
          import re
          from html import unescape
          base='https://affable-impact-924611.framer.app'
          def get(path):
              try:
                  r=urlopen(Request(base+path,headers={'User-Agent':'Mozilla/5.0'}),timeout=25)
                  return r.status, r.url, r.read().decode('utf-8','replace')
              except Exception as e:
                  return 0,str(e),''
          for path in ['/sitemap.xml','/robots.txt','/','/about','/portfolio/coinbase-2025-summer','/portfolio/ibm-2024-summer','/portfolio/hanhwa-investment','/portfolio/usda','/coinbase','/ibm']:
              status,url,body=get(path)
              print('PATH',path,'STATUS',status,'BYTES',len(body),'URL',url)
              if 'xml' in path or 'txt' in path:print('BODY',body[:6500])
              if path=='/':
                  print('HREFS',list(dict.fromkeys(unescape(x) for x in re.findall(r'href=["\\\']([^"\\\']+)["\\\']',body)))[:150])
                  print('SCRIPTS',list(dict.fromkeys(re.findall(r'<script[^>]*src=["\\\']([^"\\\']+)',body)))[:20])
                  print('STYLES',re.findall(r'<style([^>]*)>',body)[:20])
                  print('HTML_INFO',body[-1400:])
          PY
