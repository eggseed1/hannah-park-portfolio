name: Deploy exact Framer portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Capture original published Framer pages, unchanged
        run: python3 scripts/mirror-framer.py --out framer-export

      - name: Verify every portfolio route was captured
        run: |
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path('framer-export')
          manifest = json.loads((root/'framer-snapshot.json').read_text())
          assert len(manifest['routes']) >= 8, 'Incomplete Framer capture'
          for name, meta in manifest['routes'].items():
              page = root / meta['file']
              assert page.exists() and page.stat().st_size > 100000, f'Invalid page {name}'
          print('Verified', len(manifest['routes']), 'Framer HTML documents')
          PY

      - name: Keep source snapshot in GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add framer-export
          if ! git diff --cached --quiet; then
            git commit -m "Sync 1:1 Framer source snapshot [skip ci]"
            git push origin HEAD:main || echo "Source snapshot push skipped due to newer main commit"
          fi

      - name: Prepare GitHub Pages output
        run: |
          mkdir -p dist
          cp -a framer-export/. dist/

      - name: Repair relative navigation for GitHub Pages subpath
        run: python3 scripts/prepare-pages.py --root dist --base /hannah-park-portfolio/

      - name: Show Pages publishing configuration
        run: gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{build_type,source}'
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Match branch-based Pages source to the verified Framer build
        run: |
          cp dist/index.html index.html
          cp dist/404.html 404.html
          cp -a dist/about dist/portfolio dist/coinbase dist/ibm ./
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html .nojekyll about portfolio coinbase ibm
          if ! git diff --cached --quiet; then
            git commit -m "Keep Pages branch source aligned with exact Framer snapshot [skip ci]"
            git push origin HEAD:main || echo "Source sync push skipped due to newer main commit"
          fi

      - name: Upload original Framer site with corrected route links
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validate responsive routes after deployment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mobile-audit.yml --ref main --repo "$GITHUB_REPOSITORY"

